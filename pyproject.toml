[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "previa-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.4", "uvicorn==0.34.2"]

[tool.setuptools.packages.find]
include = ["previa*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
